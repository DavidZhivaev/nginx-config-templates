# Шаблон с редиректом на HTTPS
server {
    listen 80;
    server_name example.com;  # <- замените на свой домен
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;  # <- замените на свой домен

    ssl_certificate /etc/ssl/certs/example.crt;      # <- путь к сертификату
    ssl_certificate_key /etc/ssl/private/example.key; # <- путь к ключу
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/example;   # <- путь к сайту
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Логи
    access_log /var/log/nginx/ssl_access.log;
    error_log /var/log/nginx/ssl_error.log;
}
