# Node.js / Express с rate limiting и безопасными заголовками
limit_req_zone $binary_remote_addr zone=node_limit:10m rate=10r/s;

server {
    listen 80;
    server_name example.com;

    location / {
        limit_req zone=node_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Безопасные заголовки
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "default-src 'self';";

    # Логи
    access_log /var/log/nginx/node_access.log;
    error_log /var/log/nginx/node_error.log;
}
