# Шаблон для Node.js / Express приложения
server {
    listen 80;
    server_name example.com;  # <- замените на свой домен

    location / {
        proxy_pass http://localhost:3000;   # <- порт Node.js приложения
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Логи
    access_log /var/log/nginx/node_access.log;
    error_log /var/log/nginx/node_error.log;
}
